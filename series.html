<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Séries — Stories Site</title>

<style>
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:#0b0b0c;
  color:#eaeaea;
}

a{text-decoration:none;color:inherit}

header{
  max-width:1100px;
  margin:20px auto;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  width:260px;
}

main{
  max-width:1100px;
  margin:30px auto;
  padding:10px;
}

.series{
  background:#111214;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  border:1px solid #222;
}

.series h3{color:#caa45b;margin:0}
.series p{color:#9aa1a6}
</style>
</head>

<body>

<header>
  <a href="index.html"><strong>← Stories Site</strong></a>
  <input type="text" id="search" placeholder="Rechercher une série...">
</header>

<main id="list">
  <div class="series">
    <h3>Les Chroniques du Néant</h3>
    <p>Série • Fantastique • 6 épisodes</p>
  </div>

  <div class="series">
    <h3>Projet Lazarus</h3>
    <p>Série • Science-fiction • 8 épisodes</p>
  </div>

  <div class="series">
    <h3>La Ville qui murmure</h3>
    <p>Série • Mystère • En cours</p>
  </div>
</main>

<script>
const search = document.getElementById("search");
const series = document.querySelectorAll(".series");

search.addEventListener("keyup", ()=>{
  const value = search.value.toLowerCase();
  series.forEach(item=>{
    item.style.display = item.innerText.toLowerCase().includes(value)
      ? "block"
      : "none";
  });
});
</script>

</body>
</html>
