<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Histoires — Stories Site</title>

  <style>
    body{
      margin:0;
      font-family:system-ui, sans-serif;
      background:#0b0b0c;
      color:#eaeaea;
    }

    header{
      max-width:1000px;
      margin:30px auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 20px;
    }

    a{color:#caa45b;text-decoration:none}

    input{
      background:#111;
      border:1px solid #222;
      color:#fff;
      padding:8px 12px;
      border-radius:8px;
    }

    main{
      max-width:1000px;
      margin:20px auto;
      padding:0 20px;
    }

    .story{
      background:#111214;
      border:1px solid #222;
      border-radius:14px;
      padding:20px;
      margin-bottom:16px;
      transition:0.3s;
    }

    .story:hover{
      transform:translateY(-4px);
      border-color:#caa45b;
    }

    .story h3{
      margin:0;
      color:#caa45b;
    }

    .story p{
      margin:6px 0 0;
      color:#9aa1a6;
    }
