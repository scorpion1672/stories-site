<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histoires — Stories Site</title>

<style>
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:#0b0b0c;
  color:#eaeaea;
}

a{color:inherit;text-decoration:none}

header{
  max-width:1000px;
  margin:30px auto;
  padding:10px;
}

main{
  max-width:1000px;
  margin:40px auto;
  padding:20px;
}

h1{margin-bottom:10px}
p{color:#9aa1a6}

.list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin-top:30px;
}

.story{
  background:#111214;
  padding:20px;
  border-radius:14px;
  border:1px solid #222;
  transition:0.3s;
  cursor:pointer;
}

.story:hover{
  transform:translateY(-6px);
  border-color:#caa45b;
}

.story h3{
  margin:0 0 8px;
  color:#caa45b;
}

footer{
  text-align:center;
  margin:60px 0 100px;
  color:#9aa1a6;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Retour à l’accueil</a>
</header>

<main>
  <h1>Histoires</h1>
  <p>Clique sur une histoire pour commencer la lecture.</p>

  <div class="list">

    <!-- HISTOIRE 1 -->
    <a class="story" href="histoire-1.html">
      <h3>L’ombre du phare</h3>
      <p>Mystère • 5 min de lecture</p>
    </a>

    <!-- HISTOIRE 2 -->
    <a class="story" href="histoire-2.html">
      <h3>La porte qui murmure</h3>
      <p>Fantastique • 6 min de lecture</p>
    </a>

  </div>
</main>

<footer>
  © 2025 Stories Site
</footer>

</body>
</html>
